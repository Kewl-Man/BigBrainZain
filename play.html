<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigBrainZain.com | Play</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#050510',
                        surface: 'rgba(20, 20, 30, 0.6)',
                        primary: '#7c3aed',
                        accent: '#2dd4bf'
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            background-color: #050510;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* Cosmic Background with CSS Gradients */
        .cosmic-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 15% 50%, rgba(124, 58, 237, 0.15), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(45, 212, 191, 0.15), transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .action-btn {
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.5);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .action-btn:hover {
            background: rgba(124, 58, 237, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .action-btn.accent {
            background: rgba(45, 212, 191, 0.2);
            border-color: rgba(45, 212, 191, 0.5);
        }
        
        .action-btn.accent:hover {
            background: rgba(45, 212, 191, 0.4);
            box-shadow: 0 4px 12px rgba(45, 212, 191, 0.3);
        }

        .player-container {
            width: 100%;
            height: calc(100vh - 180px);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }
    </style>
</head>
<body>
    <div class="cosmic-bg"></div>

    <div class="min-h-screen flex flex-col p-4 md:p-8 max-w-7xl mx-auto">
        
        <!-- Header / Navigation -->
        <header class="flex justify-between items-center mb-8">
            <a href="index.html" class="flex items-center gap-3 text-white hover:text-accent transition-colors">
                <i class="fa-solid fa-arrow-left text-xl"></i>
                <span class="font-bold text-xl tracking-wider">Back to Arcade</span>
            </a>
            <div class="text-2xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-primary to-accent" id="game-title-header">
                Loading...
            </div>
        </header>

        <!-- Player Workspace -->
        <main class="flex-1 flex flex-col glass-panel p-4 md:p-6 rounded-2xl relative">
            
            <!-- Interactive Toolbar -->
            <div class="flex flex-wrap justify-between items-center mb-4 gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-cover bg-center border border-white/10" id="game-icon"></div>
                    <div>
                        <h1 class="text-xl font-bold m-0" id="game-title">Loading...</h1>
                        <p class="text-sm text-gray-400 m-0" id="game-category">Category</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <button id="btn-fullscreen" class="action-btn">
                        <i class="fa-solid fa-expand"></i> Fullscreen
                    </button>
                    <button id="btn-cloak" class="action-btn accent" title="Open in about:blank to hide from history">
                        <i class="fa-solid fa-mask"></i> Cloak (about:blank)
                    </button>
                </div>
            </div>

            <!-- Game Frame -->
            <div class="player-container" id="player-wrapper">
                <iframe id="game-frame" allowfullscreen src="about:blank"></iframe>
            </div>
        </main>
    </div>

    <script>
        // Use the same mock data for this frontend prototype
        const mockGames = [
            { id: 'slope', title: 'Slope', category: 'Action', image: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&q=80', plays: 124000, embedUrl: 'https://slopegame.io/' },
            { id: 'eaglercraft', title: 'Eaglercraft 1.12.2', category: 'Sandbox', image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&q=80', plays: 89000, embedUrl: 'https://eaglercraft.com/mc/1.12.2/' },
            { id: 'retrobowl', title: 'Retro Bowl', category: 'Sports', image: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600&q=80', plays: 156000, embedUrl: 'https://game316009.konggames.com/gamez/0031/6009/live/index.html' },
            { id: 'sprunki', title: 'Sprunki', category: 'Music', image: 'https://images.unsplash.com/photo-1580234811497-9df7f5c45666?w=600&q=80', plays: 54000, embedUrl: 'https://sprunki.com/' },
            { id: 5, title: 'Void Shooter', category: 'Action', image: 'https://images.unsplash.com/photo-1534423861386-85a16f5d13fd?w=600&q=80', plays: 21000, embedUrl: 'about:blank' },
            { id: 6, title: 'Mind Maze', category: 'Puzzle', image: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600&q=80', plays: 3200, embedUrl: 'about:blank' },
            { id: 7, title: 'Asteroid Miner', category: 'Simulation', image: 'https://images.unsplash.com/photo-1614729939124-032f0b56c9ce?w=600&q=80', plays: 18500, embedUrl: 'about:blank' },
            { id: 8, title: 'Quantum Chess', category: 'Strategy', image: 'https://images.unsplash.com/photo-1529699211952-734e80c4d42b?w=600&q=80', plays: 7100, embedUrl: 'about:blank' },
            { id: 9, title: 'Stellar Run', category: 'Action', image: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600&q=80', plays: 45000, embedUrl: 'about:blank' },
            { id: 10, title: 'Neon Tetris', category: 'Puzzle', image: 'https://images.unsplash.com/photo-1552820728-8b83bb6b773f?w=600&q=80', plays: 11200, embedUrl: 'about:blank' },
        ];

        document.addEventListener('DOMContentLoaded', () => {
            // Get game ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const gameId = urlParams.get('game');
            
            // Find game data
            const game = mockGames.find(g => g.id.toString() === gameId);
            
            if (game) {
                // Populate UI
                document.getElementById('game-title').innerText = game.title;
                document.getElementById('game-title-header').innerText = game.title;
                document.getElementById('game-category').innerHTML = `<i class="fa-solid fa-gamepad"></i> ${game.category} • <i class="fa-solid fa-fire"></i> ${game.plays.toLocaleString()} plays`;
                document.getElementById('game-icon').style.backgroundImage = `url('${game.image}')`;
                
                // Load Game Iframe
                const frame = document.getElementById('game-frame');
                frame.src = game.embedUrl;
            } else {
                document.getElementById('game-title').innerText = "Game Not Found";
                document.getElementById('game-title-header').innerText = "Error";
            }

            // --- Fullscreen Logic ---
            const btnFullscreen = document.getElementById('btn-fullscreen');
            const playerWrapper = document.getElementById('player-wrapper');

            btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (playerWrapper.requestFullscreen) {
                        playerWrapper.requestFullscreen();
                    } else if (playerWrapper.mozRequestFullScreen) { // Firefox
                        playerWrapper.mozRequestFullScreen();
                    } else if (playerWrapper.webkitRequestFullscreen) { // Chrome, Safari and Opera
                        playerWrapper.webkitRequestFullscreen();
                    } else if (playerWrapper.msRequestFullscreen) { // IE/Edge
                        playerWrapper.msRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            });

            // --- Cloak (about:blank) Logic ---
            const btnCloak = document.getElementById('btn-cloak');
            
            btnCloak.addEventListener('click', () => {
                if (!game) return;
                
                // 1. Open new about:blank window
                let win = window.open('about:blank', '_blank');
                if (!win) {
                    alert("Popup blocker prevented cloaking. Please allow popups for this site.");
                    return;
                }
                
                // 2. Write iframe to full screen
                win.document.write(`
                    <!DOCTYPE html>
                    <html style="margin:0; padding:0; height:100%; overflow:hidden;">
                    <head>
                        <title>Classes</title>
                        <link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png">
                    </head>
                    <body style="margin:0; padding:0; height:100%; overflow:hidden; background-color:#000;">
                        <iframe src="${game.embedUrl}" style="border:none; width:100%; height:100%; margin:0; padding:0;"></iframe>
                    </body>
                    </html>
                `);
                win.document.close();
                
                // 3. Instantly redirect original tab to Google Classroom
                window.location.replace('https://classroom.google.com');
            });
        });
    </script>
</body>
</html>
